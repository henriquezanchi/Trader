name: Simulação horária BTC
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trade-lab-simulation
  cancel-in-progress: false
jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar ciclo virtual
        run: node scripts/tick.mjs
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
